<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音效测试</title>
    <style>
      body {
        background: #12151a;
        color: #d7dde5;
        font: 14px/1.6 'PingFang SC', 'Microsoft YaHei', sans-serif;
        padding: 24px;
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 16px;
        color: #ffd23f;
        margin-bottom: 8px;
      }
      .hint {
        color: #8b949e;
        font-size: 12px;
        margin-bottom: 16px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid #2a3038;
        border-radius: 8px;
        margin: 6px 0;
      }
      .item .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .st {
        width: 60px;
        font-size: 12px;
        color: #8b949e;
        text-align: right;
      }
      button {
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.ok {
        border-color: #4ade80;
        color: #4ade80;
      }
    </style>
  </head>
  <body>
    <h1>音效测试</h1>
    <p class="hint">逐个点「播放」。全部能响 → 文件/浏览器正常，问题在游戏代码；某个不响 → 该文件有问题。</p>
    <div id="list"></div>
    <script>
      const FILES = [
        '_test.wav',
        '撞击音效.mp3',
        '脚步.mp3',
        '汽车行驶-中频嗡鸣.mp3',
        '汽车行驶-低频嗡鸣.mp3',
        '背景音乐.mp3',
        '火车头.mp3',
        '我超勇的.mp3',
        '我开水果摊的能卖给你生瓜蛋子.mp3',
        '焖子.mp3',
        '鸡汤来咯.mp3',
        '弱欸.mp3',
        '生瓜蛋子.mp3',
      ];
      const list = document.getElementById('list');
      for (const f of FILES) {
        const row = document.createElement('div');
        row.className = 'item';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = f;
        const st = document.createElement('div');
        st.className = 'st';
        st.textContent = '…';
        const btn = document.createElement('button');
        btn.textContent = '播放';
        const a = new Audio('../assets/音效/' + f);
        a.preload = 'auto';
        a.addEventListener('canplaythrough', () => (st.textContent = '就绪'));
        a.addEventListener('loadedmetadata', () => (st.textContent = a.duration.toFixed(1) + 's'));
        a.addEventListener('error', () => {
          const c = a.error ? a.error.code : '?';
          st.textContent = '失败(' + c + ')';
          st.title = 'src=' + a.src;
          st.style.color = '#ff6b6b';
          console.log('音频加载失败:', f, 'src=', a.src, 'error=', a.error);
        });
        btn.addEventListener('click', () => {
          a.currentTime = 0;
          a.play()
            .then(() => (btn.className = 'ok'))
            .catch((e) => {
              st.textContent = e.name;
              st.title = e.message;
              st.style.color = '#ff6b6b';
              console.log('播放失败:', f, e);
            });
        });
        row.append(name, st, btn);
        list.append(row);
      }
    </script>
  </body>
</html>
